server.port=8080
deepl.api.key=ef6adbe4-86e4-4e92-a8c4-4b8cff0485b6:fx

# Serve static files directly from src/ (so changes reflect without rebuild)
spring.web.resources.static-locations=file:src/main/resources/static/,classpath:/static/

# ==========================================
# H2 Database & Spring Data JPA Configuration
# ==========================================
spring.datasource.url=jdbc:h2:file:./data/lexildb;DB_CLOSE_ON_EXIT=FALSE;AUTO_RECONNECT=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# H2 Console Web (acessivel em http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true